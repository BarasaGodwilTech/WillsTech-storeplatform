<body>

<main id="main-content" class="container">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><i class="fa-solid fa-chevron-right"></i><span>Track order</span></nav>
  <section class="page-hero t0"><div><h1>Track your order</h1><p>Enter the order number from your confirmation and the phone number or email you used at checkout.</p></div><div class="ph-icon" aria-hidden="true"><i class="fa-solid fa-box-open"></i></div></section>
  <form class="track-form" id="track-form" novalidate>
    <div class="form-group"><label class="form-label" for="t-number">Order number</label><input class="form-input" id="t-number" placeholder="WT-2026-00042" autocomplete="off" autocapitalize="characters" required></div>
    <div class="form-group"><label class="form-label" for="t-contact">Phone or email used</label><input class="form-input" id="t-contact" placeholder="0751 924 844 or you@email.com" autocomplete="tel" required></div>
    <div class="err-box" id="t-error" hidden></div>
    <button class="btn btn-primary btn-lg btn-block" type="submit" id="t-btn" style="margin-top:14px"><i class="fa-solid fa-magnifying-glass"></i> Find my order</button>
  </form>
  <div id="track-result" class="confirm" style="margin-top:8px"></div>
</main>
